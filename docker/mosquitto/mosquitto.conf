# Minimal single-tenant broker config for this app's realtime attendance
# pipeline - one shared user, no per-client ACL backend (see plan notes:
# this is a LAN-only, single-user app, not a multi-tenant SaaS).

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
